<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Sbka Bank</h2>
    <form id="accountForm">
        <input type="text" id="customerName" placeholder="Customer Name">
        <input type="text" id="balance" placeholder="Initial Balance">
        <button type="submit">Create Account</button>
    </form>

    <form id="depositForm">
        <input type="text" id="accountNumber" placeholder="Account Number">
        <input type="text" id="depositAmount" placeholder="Deposit Amount">
        <button type="submit">Deposit</button>
    </form>

    <form id="withdrawForm">
        <input type="text" id="accountNumberWithdraw" placeholder="Account Number">
        <input type="text" id="withdrawAmount" placeholder="Withdraw Amount">
        <button type="submit">Withdraw</button>
    </form>

    <script src="constructor.js"></script>
</body>
</html>
