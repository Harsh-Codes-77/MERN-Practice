<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>

    <style>

        body{
            font-family: Arial;
            margin:20px;
            background:#f2f2f2;
        }

        input,select,button{
            padding:8px;
            margin:5px;
        }

        .card{
            background:white;
            padding:10px;
            margin:10px;
            border-radius:10px;
            width:250px;
            display:inline-block;
            box-shadow:0 0 5px gray;
        }

    </style>

</head>
<body>

<h2>Shopping Cart</h2>

<input type="text" id="name" placeholder="Product Name">

<input type="number" id="price" placeholder="Price">

<input type="number" id="quantity" placeholder="Quantity">

<select id="category">
    <option value="">Select Category</option>
    <option>Electronics</option>
    <option>Clothes</option>
    <option>Food</option>
    <option>Books</option>
</select>

<button id="btn" onclick="addProduct()">Add Product</button>

<br><br>

<input type="text" id="search" placeholder="Search by Name" onkeyup="displayProducts()">

<select id="filter" onchange="displayProducts()">
    <option value="All">All Categories</option>
    <option>Electronics</option>
    <option>Clothes</option>
    <option>Food</option>
    <option>Books</option>
</select>

<button onclick="clearCart()">Clear Cart</button>

<hr>

<h3>Cart Summary</h3>

<p id="summary"></p>

<hr>

<div id="products"></div>

<script src="script.js"></script>

</body>
</html>
